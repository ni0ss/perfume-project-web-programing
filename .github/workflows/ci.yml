name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  django-and-browser-tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-do-not-use-in-deployments
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      CACHE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: browser-actions/setup-chrome@v2
        id: setup-chrome
        with:
          chrome-version: stable
          install-chromedriver: true
      - name: Install project and browser-test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Run unit and integration tests
        run: python manage.py test
      - name: Run Selenium storefront smoke test
        env:
          RUN_BROWSER_TESTS: "1"
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          TEST_ARTIFACT_DIR: test-artifacts
        run: python manage.py test e2e
      - name: Check production security settings
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-production-check-secret-value-should-be-replaced
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --deploy
      - name: Build Docker image
        run: docker build -t perfume-project:ci .
      - name: Upload browser proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perfume-browser-test
          path: test-artifacts/
          if-no-files-found: ignore
