# Standalone optional lab: `sh scripts/start-scale-demo.sh`
# This intentionally omits Ollama/model downloads so infrastructure testing
# stays lightweight and independent from the optional assistant service.
services:
  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: perfume-project:scale-demo
    deploy:
      endpoint_mode: dnsrr
    command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2", "--access-logfile", "-"]
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${SCALE_DEMO_DJANGO_SECRET_KEY:?Run scripts/start-scale-demo.sh to create a local secret}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,proxy
      DJANGO_CSRF_TRUSTED_ORIGINS: https://localhost:8443
      DJANGO_USE_X_FORWARDED_PROTO: "1"
      DJANGO_SECURE_SSL_REDIRECT: "1"
      DJANGO_SESSION_COOKIE_SECURE: "1"
      DJANGO_CSRF_COOKIE_SECURE: "1"
      DJANGO_SECURE_HSTS_SECONDS: "0"
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: "0"
      DJANGO_SECURE_HSTS_PRELOAD: "0"
      DJANGO_DATABASE_ENGINE: django.db.backends.postgresql
      DJANGO_DATABASE_NAME: perfume
      DJANGO_DATABASE_USER: perfume_app
      DJANGO_DATABASE_PASSWORD: ${SCALE_DEMO_APP_PASSWORD:?Run scripts/start-scale-demo.sh to create local passwords}
      DJANGO_DATABASE_HOST: postgres-primary
      DJANGO_DATABASE_REPLICA_HOST: postgres-replica
      DJANGO_DATABASE_PORT: "5432"
      DJANGO_DATABASE_CONN_MAX_AGE: "60"
      CACHE_URL: redis://cache:6379/1
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ./media:/app/media
    depends_on:
      scale-init:
        condition: service_completed_successfully
      postgres-replica:
        condition: service_healthy
      cache:
        condition: service_healthy

  scale-init:
    build: .
    image: perfume-project:scale-demo
    command: ["sh", "-c", "python manage.py migrate && python manage.py seed_demo_catalog"]
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${SCALE_DEMO_DJANGO_SECRET_KEY:?Run scripts/start-scale-demo.sh to create a local secret}
      DJANGO_DATABASE_ENGINE: django.db.backends.postgresql
      DJANGO_DATABASE_NAME: perfume
      DJANGO_DATABASE_USER: perfume_app
      DJANGO_DATABASE_PASSWORD: ${SCALE_DEMO_APP_PASSWORD:?Run scripts/start-scale-demo.sh to create local passwords}
      DJANGO_DATABASE_HOST: postgres-primary
      DJANGO_DATABASE_PORT: "5432"
      CACHE_URL: redis://cache:6379/1
    depends_on:
      postgres-primary:
        condition: service_healthy
      cache:
        condition: service_healthy
    restart: "no"

  postgres-primary:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: perfume
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCALE_DEMO_POSTGRES_PASSWORD:?Run scripts/start-scale-demo.sh to create local passwords}
      POSTGRES_APP_PASSWORD: ${SCALE_DEMO_APP_PASSWORD:?Run scripts/start-scale-demo.sh to create local passwords}
      POSTGRES_REPLICATION_PASSWORD: ${SCALE_DEMO_REPLICATION_PASSWORD:?Run scripts/start-scale-demo.sh to create local passwords}
    command: ["postgres", "-c", "wal_level=replica", "-c", "max_wal_senders=10", "-c", "max_replication_slots=10"]
    volumes:
      - scale_postgres_primary:/var/lib/postgresql/data
      - ./deploy/postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perfume"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p "$${PGDATA}"
        printf 'postgres-primary:5432:*:perfume_replica:%s\n' "$${POSTGRES_REPLICATION_PASSWORD}" > /var/lib/postgresql/.pgpass
        chown postgres:postgres /var/lib/postgresql/.pgpass
        chmod 600 /var/lib/postgresql/.pgpass
        if [ ! -s "$${PGDATA}/PG_VERSION" ]; then
          rm -rf "$${PGDATA:?}"/*
          chown postgres:postgres "$${PGDATA}"
          until gosu postgres pg_basebackup -d "host=postgres-primary user=perfume_replica passfile=/var/lib/postgresql/.pgpass" -D "$${PGDATA}" -R -X stream -P -C -S perfume_demo_replica; do
            echo 'Waiting for PostgreSQL primary...'
            sleep 2
          done
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SCALE_DEMO_POSTGRES_PASSWORD:?Run scripts/start-scale-demo.sh to create local passwords}
      POSTGRES_REPLICATION_PASSWORD: ${SCALE_DEMO_REPLICATION_PASSWORD:?Run scripts/start-scale-demo.sh to create local passwords}
    volumes:
      - scale_postgres_replica:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perfume"]
      interval: 5s
      timeout: 3s
      retries: 30

  proxy:
    image: haproxy:3.2-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        apk add --no-cache openssl >/dev/null
        if [ ! -s /certs/localhost.pem ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -sha256 -days 365 \
            -keyout /certs/localhost.key -out /certs/localhost.crt \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost,IP:127.0.0.1'
          cat /certs/localhost.crt /certs/localhost.key > /certs/localhost.pem
          chmod 600 /certs/localhost.key /certs/localhost.pem
        fi
        exec haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg
    depends_on:
      web:
        condition: service_started
      media:
        condition: service_started
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:8404:8404"
    volumes:
      - ./deploy/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - scale_tls_certs:/certs:ro
    restart: unless-stopped

  media:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
      - ./media:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  scale_postgres_primary:
  scale_postgres_replica:
  scale_tls_certs:
