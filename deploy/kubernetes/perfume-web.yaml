apiVersion: apps/v1
kind: Deployment
metadata:
  name: perfume-web
  labels:
    app.kubernetes.io/name: perfume-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: perfume-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: perfume-web
    spec:
      containers:
        - name: web
          image: perfume-project:local
          imagePullPolicy: IfNotPresent
          command: ["gunicorn", "config.wsgi:application", "--bind", "0.0.0.0:8000", "--workers", "2"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: perfume-runtime
            - secretRef:
                name: perfume-secrets
          readinessProbe:
            httpGet:
              path: /healthz/
              port: http
              httpHeaders:
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: perfume-web
spec:
  selector:
    app.kubernetes.io/name: perfume-web
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: perfume-web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: perfume-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
