global
    log stdout format raw local0
    maxconn 2048

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 60s
    timeout server 60s

resolvers docker
    nameserver docker 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s

frontend http_in
    bind :80
    http-request redirect scheme https code 308

frontend https_in
    bind :443 ssl crt /certs/localhost.pem
    http-request set-header X-Forwarded-Proto https
    acl is_media path_beg /media/
    use_backend perfume_media if is_media
    default_backend perfume_web

backend perfume_web
    balance roundrobin
    option httpchk
    http-check send meth GET uri /healthz/ ver HTTP/1.1 hdr Host localhost hdr X-Forwarded-Proto https
    http-check expect status 200
    server-template web 1-5 web:8000 check resolvers docker init-addr libc,none

backend perfume_media
    server media media:8080 check

listen stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s
    stats show-legends
